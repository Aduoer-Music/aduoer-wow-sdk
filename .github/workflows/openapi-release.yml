name: Publish OpenAPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish rolling OpenAPI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: openapi-latest
        run: |
          set -euo pipefail

          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" openapi.json --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Latest OpenAPI document" \
              --notes "Generated from commit $GITHUB_SHA on main."
          else
            gh release create "$RELEASE_TAG" openapi.json \
              --prerelease \
              --title "Latest OpenAPI document" \
              --notes "Generated from commit $GITHUB_SHA on main."
          fi
